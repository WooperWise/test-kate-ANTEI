[project]
name = "mito-harness"
version = "0.1.0"
description = "Harness for analyzing mitochondrial medicine research: orchestrator, sub-agents, tools, runtime skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mito_harness"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "test", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]  # str+Enum kept: pydantic v2 serialization relies on it across the codebase

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
